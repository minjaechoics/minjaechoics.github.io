  label: Undergraduate Researcher — Efficient ML & Foundation Model Systems
  email: minjaechoi.cs@gmail.com
  location: Daejeon, South Korea
  image: ""
  summary: >
    My research interests lie in Efficient ML, especially for AI foundation models, with a focus
    on end-to-end foundation model systems spanning architecture design, large-scale training,
    low-bit quantization, efficient deployment, and inference kernel optimization. I am also
    interested in theoretical computer science, particularly algorithmic graph structure theory
    and algorithm design for NP-hard problems.

